# Nothing in here is specific to one deployment. The D1 database is provisioned
# by name on the first deploy, and the custom domain is passed at deploy time:
#   npx wrangler deploy --domain heartbeat.example.com
# Secrets (PING_TOKEN, READ_TOKEN, SLACK_WEBHOOK_URL) are set with
# `wrangler secret put`. See README.md.
name = "heartbeat-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "heartbeat-worker"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
